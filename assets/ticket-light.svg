<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 64" width="840" height="64" role="img" aria-label="Admit one. Prefer to explore? Play my portfolio as a pixel-art fairground. Play.">
<style>
.sheen-ticket-light{animation:sweep-ticket-light 7s ease-in-out infinite}
@keyframes sweep-ticket-light{0%,62%{transform:translateX(-260px)}100%{transform:translateX(1100px)}}
@media (prefers-reduced-motion: reduce){.sheen-ticket-light{animation:none;opacity:0}}
</style>
<defs>
<linearGradient id="holo-ticket-light" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2aa7d0"/><stop offset="0.5" stop-color="#7d4bd0"/><stop offset="1" stop-color="#b23fc4"/>
</linearGradient>
<linearGradient id="glare-ticket-light" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="clip-ticket-light"><rect width="840" height="64" rx="12"/></clipPath>
</defs>
<rect width="840" height="64" rx="12" fill="#f4f4f4"/>
<g clip-path="url(#clip-ticket-light)"><rect class="sheen-ticket-light" x="0" y="-20" width="200" height="104" fill="url(#glare-ticket-light)" transform="rotate(12)"/></g>
<rect x="0.5" y="0.5" width="839" height="63" rx="11.5" fill="none" stroke="#c3c0c0"/>
<rect x="0.5" y="0.5" width="839" height="63" rx="11.5" fill="none" stroke="url(#holo-ticket-light)" stroke-opacity="0.45"/>
<text x="60" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.2em" fill="url(#holo-ticket-light)">ADMIT ONE</text>
<line x1="120" y1="10" x2="120" y2="54" stroke="#c3c0c0" stroke-dasharray="3 4"/>
<text x="142" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5c5959"><tspan font-weight="700" fill="#1c1b1b">Prefer to explore?</tspan> Play my portfolio as a pixel-art fairground.</text>
<path d="M704 14 H816 V40 L806 50 H704 Z" fill="#1c1b1b"/>
<text x="760" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#f3f1f0">PLAY ▶</text>
</svg>
