<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-label="Naman Gururani — payments that must not lose a record, streams that must not stop, a portfolio you can walk around.">
<title>Naman Gururani</title>
<style>
@keyframes type0-dark{0.00%{width:0;animation-timing-function:steps(36,end)}17.00%{width:324px}30.00%{width:324px}30.01%{width:0}100%{width:0}}
@keyframes type1-dark{0%{width:0}33.33%{width:0;animation-timing-function:steps(26,end)}50.33%{width:234px}63.33%{width:234px}63.34%{width:0}100%{width:0}}
@keyframes type2-dark{0%{width:0}66.67%{width:0;animation-timing-function:steps(31,end)}83.67%{width:279px}96.67%{width:279px}96.68%{width:0}100%{width:0}}
.t0-dark{animation:type0-dark 12s linear infinite}
.t1-dark{animation:type1-dark 12s linear infinite}
.t2-dark{animation:type2-dark 12s linear infinite}
@keyframes caret-dark{0.00%{transform:translateX(0);animation-timing-function:steps(36,end)}17.00%{transform:translateX(324px)}30.00%{transform:translateX(324px)}33.33%{transform:translateX(0);animation-timing-function:steps(26,end)}50.33%{transform:translateX(234px)}63.33%{transform:translateX(234px)}66.67%{transform:translateX(0);animation-timing-function:steps(31,end)}83.67%{transform:translateX(279px)}96.67%{transform:translateX(279px)}100%{transform:translateX(0)}}
@keyframes blink-dark{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{transform-box:fill-box;transform-origin:0 0;animation:caret-dark 12s linear infinite,blink-dark 1s steps(2) infinite}
.drift{transform-box:fill-box;transform-origin:0 0;animation:drift-dark 9s linear infinite}
@keyframes drift-dark{from{transform:translateX(-736px)}to{transform:translateX(0)}}
.pulse{animation:pulse-dark 4.5s ease-in-out infinite}
@keyframes pulse-dark{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="holo-dark" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a9e8ff"/><stop offset="0.17" stop-color="#d9bcff"/><stop offset="0.33" stop-color="#fcd6ff"/>
<stop offset="0.5" stop-color="#a9e8ff"/><stop offset="0.67" stop-color="#d9bcff"/><stop offset="0.83" stop-color="#fcd6ff"/><stop offset="1" stop-color="#a9e8ff"/>
</linearGradient>
<clipPath id="rule-dark"><rect x="52" y="144" width="736" height="3"/></clipPath>
<clipPath id="type0-dark"><rect class="t0-dark" x="52" y="168" width="324" height="26"/></clipPath><clipPath id="type1-dark"><rect class="t1-dark" x="52" y="168" width="0" height="26"/></clipPath><clipPath id="type2-dark"><rect class="t2-dark" x="52" y="168" width="0" height="26"/></clipPath>
</defs>
<rect width="840" height="220" rx="16" fill="#141313"/>
<rect x="0.5" y="0.5" width="839" height="219" rx="15.5" fill="none" stroke="#444748"/>
<text x="52" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#e5e2e1">Naman Gururani</text>
<text x="54" y="126" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="0.05em" fill="#a9e8ff">DATA ENGINEER // PAYMENTS &amp; STREAMING</text>
<g clip-path="url(#rule-dark)"><rect class="drift" x="52" y="144" width="1472" height="3" fill="url(#holo-dark)"/></g>
<g clip-path="url(#type0-dark)"><text x="52" y="186" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e5e2e1"><tspan>payments that must not lose a record</tspan></text></g><g clip-path="url(#type1-dark)"><text x="52" y="186" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e5e2e1"><tspan>streams that must not stop</tspan></text></g><g clip-path="url(#type2-dark)"><text x="52" y="186" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e5e2e1"><tspan>a portfolio you can walk around</tspan></text></g>
<rect class="caret" x="54" y="172" width="8" height="19" fill="#a9e8ff" transform="translate(324 0)"/>
<rect class="pulse" x="716" y="70" width="14" height="60" rx="3" fill="#a9e8ff" style="animation-delay:0s"/><rect class="pulse" x="746" y="78" width="14" height="48" rx="3" fill="#d9bcff" style="animation-delay:0.6s"/><rect class="pulse" x="776" y="86" width="14" height="36" rx="3" fill="#fcd6ff" style="animation-delay:1.2s"/>
</svg>
