<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-label="Naman Gururani — payments that must not lose a record, streams that must not stop, a portfolio you can walk around.">
<title>Naman Gururani</title>
<style>
@keyframes type0-light{0.00%{width:0;animation-timing-function:steps(36,end)}17.00%{width:324px}30.00%{width:324px}30.01%{width:0}100%{width:0}}
@keyframes type1-light{0%{width:0}33.33%{width:0;animation-timing-function:steps(26,end)}50.33%{width:234px}63.33%{width:234px}63.34%{width:0}100%{width:0}}
@keyframes type2-light{0%{width:0}66.67%{width:0;animation-timing-function:steps(31,end)}83.67%{width:279px}96.67%{width:279px}96.68%{width:0}100%{width:0}}
.t0-light{animation:type0-light 12s linear infinite}
.t1-light{animation:type1-light 12s linear infinite}
.t2-light{animation:type2-light 12s linear infinite}
@keyframes caret-light{0.00%{transform:translateX(0);animation-timing-function:steps(36,end)}17.00%{transform:translateX(324px)}30.00%{transform:translateX(324px)}33.33%{transform:translateX(0);animation-timing-function:steps(26,end)}50.33%{transform:translateX(234px)}63.33%{transform:translateX(234px)}66.67%{transform:translateX(0);animation-timing-function:steps(31,end)}83.67%{transform:translateX(279px)}96.67%{transform:translateX(279px)}100%{transform:translateX(0)}}
@keyframes blink-light{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{transform-box:fill-box;transform-origin:0 0;animation:caret-light 12s linear infinite,blink-light 1s steps(2) infinite}
.drift{transform-box:fill-box;transform-origin:0 0;animation:drift-light 9s linear infinite}
@keyframes drift-light{from{transform:translateX(-736px)}to{transform:translateX(0)}}
.pulse{animation:pulse-light 4.5s ease-in-out infinite}
@keyframes pulse-light{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="holo-light" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2aa7d0"/><stop offset="0.17" stop-color="#7d4bd0"/><stop offset="0.33" stop-color="#b23fc4"/>
<stop offset="0.5" stop-color="#2aa7d0"/><stop offset="0.67" stop-color="#7d4bd0"/><stop offset="0.83" stop-color="#b23fc4"/><stop offset="1" stop-color="#2aa7d0"/>
</linearGradient>
<clipPath id="rule-light"><rect x="52" y="144" width="736" height="3"/></clipPath>
<clipPath id="type0-light"><rect class="t0-light" x="52" y="168" width="324" height="26"/></clipPath><clipPath id="type1-light"><rect class="t1-light" x="52" y="168" width="0" height="26"/></clipPath><clipPath id="type2-light"><rect class="t2-light" x="52" y="168" width="0" height="26"/></clipPath>
</defs>
<rect width="840" height="220" rx="16" fill="#f4f4f4"/>
<rect x="0.5" y="0.5" width="839" height="219" rx="15.5" fill="none" stroke="#c3c0c0"/>
<text x="52" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#1c1b1b">Naman Gururani</text>
<text x="54" y="126" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="0.05em" fill="#2aa7d0">DATA ENGINEER // PAYMENTS &amp; STREAMING</text>
<g clip-path="url(#rule-light)"><rect class="drift" x="52" y="144" width="1472" height="3" fill="url(#holo-light)"/></g>
<g clip-path="url(#type0-light)"><text x="52" y="186" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1c1b1b"><tspan>payments that must not lose a record</tspan></text></g><g clip-path="url(#type1-light)"><text x="52" y="186" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1c1b1b"><tspan>streams that must not stop</tspan></text></g><g clip-path="url(#type2-light)"><text x="52" y="186" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#1c1b1b"><tspan>a portfolio you can walk around</tspan></text></g>
<rect class="caret" x="54" y="172" width="8" height="19" fill="#2aa7d0" transform="translate(324 0)"/>
<rect class="pulse" x="716" y="70" width="14" height="60" rx="3" fill="#2aa7d0" style="animation-delay:0s"/><rect class="pulse" x="746" y="78" width="14" height="48" rx="3" fill="#7d4bd0" style="animation-delay:0.6s"/><rect class="pulse" x="776" y="86" width="14" height="36" rx="3" fill="#b23fc4" style="animation-delay:1.2s"/>
</svg>
